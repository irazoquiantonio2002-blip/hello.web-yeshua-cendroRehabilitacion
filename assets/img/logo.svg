  <path d="M100 46 L100 46" stroke="#F5EDF3" stroke-width="7" stroke-linecap="round"/>

  <!-- puerta en forma de arco -->
  <path d="M84 158 V126 A16 16 0 0 1 116 126 V158 Z" fill="#F5EDF3" opacity="0.16"/>
  <path d="M84 158 V126 A16 16 0 0 1 116 126 V158" fill="none" stroke="#F5EDF3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- corazon: encuentro contigo mismo -->
  <path d="M100 118
           C93 108, 76 110, 76 126
           C76 140, 92 149, 100 156
           C108 149, 124 140, 124 126
           C124 110, 107 108, 100 118 Z"
        fill="url(#yeshuaAccent)"/>
</svg>
